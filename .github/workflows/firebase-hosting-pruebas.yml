# Deploy the Pruebas branch to a Firebase Hosting preview channel.
name: Deploy to Firebase Hosting (Pruebas)
on:
  push:
    branches:
      - Pruebas

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPROBACIONMAF }}
          channelId: pruebas
          expires: 30d
          projectId: comprobacionmaf
